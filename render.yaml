# render.yaml — Configuração de Deploy do Equilibra no Render
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: equilibra-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BILLING_ENFORCE
        value: false
      - key: LOCAL_PLAN
        value: avancado
      # Preencha no painel do Render em Settings > Environment:
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # você digita no painel — nunca vai para o git
      # Opcional: chave de criptografia de dados (32 bytes em base64)
      # - key: EQUILIBRA_DATA_KEY
      #   sync: false
      # WhatsApp Gateway REST (Opcional - Evolution API ou Z-API):
      - key: WA_GATEWAY_URL
        sync: false
      - key: WA_GATEWAY_KEY
        sync: false
      - key: WA_INSTANCE_NAME
        value: equilibra

